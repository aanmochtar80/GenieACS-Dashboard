<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} - GenieACS Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">⚡</div>
        <div class="brand-text">
          <h1>GenieACS Pro</h1>
          <span>Core Monitoring</span>
        </div>
      </div>

      <ul class="nav-links">
        <li class="nav-item {{ if eq .ActivePage "dashboard" }}active{{ end }}">
          <a href="/">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="nav-item {{ if eq .ActivePage "devices" }}active{{ end }}">
          <a href="/devices">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <span>Perangkat (CPE)</span>
          </a>
        </li>
        <li class="nav-item {{ if eq .ActivePage "topology" }}active{{ end }}">
          <a href="/topology">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
            <span>Topologi Jaringan</span>
          </a>
        </li>
        <li class="nav-item {{ if eq .ActivePage "wireguard" }}active{{ end }}">
          <a href="/wireguard">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            <span>WireGuard VPN</span>
          </a>
        </li>
        <li class="nav-item {{ if eq .ActivePage "settings" }}active{{ end }}">
          <a href="/settings">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span>Pengaturan</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="status-indicator">
          <span class="dot"></span>
          <span>GenieACS Online</span>
        </div>
        <span class="mono-text">v2.0</span>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      <header class="top-navbar">
        <div class="page-title">
          <h2>{{ .Title }}</h2>
        </div>
        <div class="top-actions">
          <div class="badge-tag">
            <span class="dot"></span>
            <span>Golang Native Engine</span>
          </div>
        </div>
      </header>

      <section class="content-body">
        {{ template "content" . }}
      </section>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
